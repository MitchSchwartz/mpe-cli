name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck -S error -x bin/mpe lib/*.sh commands/*.sh
      - name: bash -n
        run: for f in bin/mpe lib/*.sh commands/*.sh; do bash -n "$f"; done
